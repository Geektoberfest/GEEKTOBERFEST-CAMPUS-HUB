{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">Organize your work</p><h1>Tasks</h1></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><a class="btn" href="{{url_for('main.export_tasks_route')}}" download="tasks.json">Export tasks</a><button class="btn" onclick="openModal('import-modal')">Import tasks</button><button class="btn primary" onclick="openModal('task-modal')">+ New task</button></div></div><div class="toolbar"><input id="taskSearch" placeholder="Search tasks..." aria-label="Search tasks"><select id="taskStatus" aria-label="Filter tasks by status"><option value="all">All status</option><option value="pending">Pending</option><option value="completed">Completed</option></select><select id="taskPriority" aria-label="Filter tasks by priority"><option value="all">All priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select><select id="taskCategory" aria-label="Filter tasks by category"><option value="all">All category</option><option value="assignment">Assignment</option><option value="exam">Exam</option><option value="project">Project</option><option value="personal">Personal</option><option value="other">Other</option></select></div><div id="taskList" class="card table-card"><div class="loading">Loading tasks...</div></div><div id="task-modal" class="modal"><div class="modal-box"><button class="close" aria-label="Close dialog" onclick="closeModal('task-modal')">×</button><h2 id="taskModalTitle">New task</h2><form id="taskForm" class="form-grid"><label>Title<input name="title" required maxlength="150"><input type="hidden" name="id"></label><label>Description<textarea name="description" maxlength="2000"></textarea></label><div class="form-row"><label>Priority<select name="priority"><option>medium</option><option>high</option><option>low</option></select></label><label>Category<select name="category"><option value="assignment">Assignment</option><option value="exam">Exam</option><option value="project">Project</option><option value="personal">Personal</option><option value="other">Other</option></select></label><label>Due date<input type="date" name="due_date"></label></div><button class="btn primary">Create task</button></form></div></div><div id="import-modal" class="modal"><div class="modal-box"><button class="close" aria-label="Close dialog" onclick="closeModal('import-modal')">×</button><h2>Import tasks</h2><p class="muted">Upload a JSON file containing tasks to import into your account.</p><form id="importTasksForm" method="post" action="{{url_for('main.import_tasks_route')}}" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>JSON File<input type="file" name="file" accept=".json,application/json" required></label><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;"><button type="button" class="btn" onclick="closeModal('import-modal')">Cancel</button><button type="submit" class="btn primary">Import</button></div></form></div></div>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/tasks.js')}}"></script>{% endblock %}
