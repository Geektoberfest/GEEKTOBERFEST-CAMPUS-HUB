{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">Organize your work</p><h1>Tasks</h1></div><button class="btn primary" onclick="openModal('task-modal')">+ New task</button></div><div class="toolbar"><input id="taskSearch" placeholder="Search tasks..."><select id="taskStatus"><option value="all">All status</option><option value="pending">Pending</option><option value="completed">Completed</option></select><select id="taskPriority"><option value="all">All priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select><select id="taskCategory"><option value="all">All category</option><option value="assignment">Assignment</option><option value="exam">Exam</option><option value="project">Project</option><option value="personal">Personal</option><option value="other">Other</option></select></div><div id="bulkBar" class="bulk-bar" style="display:none"><span id="bulkCount" class="bulk-count"></span><button class="btn primary" onclick="bulkAction('complete_all')">✔ Mark complete</button><button class="btn" onclick="bulkAction('incomplete_all')">↩ Mark pending</button><button class="btn danger" onclick="bulkAction('delete_all')">🗑 Delete selected</button><button class="btn ghost" onclick="toggleSelectAll(false)">✕ Deselect all</button></div><div id="taskList" class="card table-card"><div class="loading">Loading tasks...</div></div><div id="task-modal" class="modal"><div class="modal-box"><button class="close" onclick="closeModal('task-modal')">×</button><h2 id="taskModalTitle">New task</h2><form id="taskForm" class="form-grid"><label>Title<input name="title" required maxlength="150">
<input type="hidden" name="id"></label><label>Description<textarea name="description" maxlength="2000"></textarea></label><div class="form-row"><label>Priority<select name="priority"><option>medium</option><option>high</option><option>low</option></select></label><label>Category<select name="category"><option value="assignment">Assignment</option><option value="exam">Exam</option><option value="project">Project</option><option value="personal">Personal</option><option value="other">Other</option></select></label><label>Due date<input type="date" name="due_date"></label></div><button class="btn primary">Create task</button></form></div></div>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/tasks.js')}}"></script>{% endblock %}
